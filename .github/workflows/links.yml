name: Enllaços i traduccions

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"   # cada dilluns
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traduccions completes i pàgines al dia
        run: |
          python3 build/build.py --strict
          git diff --exit-code --stat || (echo "Les pàgines generades no coincideixen amb el codi font: executa python3 build/build.py i fes commit." && exit 1)
      - name: Enllaços interns, ancores i telèfons
        run: python3 scripts/check-links.py
      - name: Enllaços externs (només setmanal o manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/check-links.py --external
